name: Verify public legal site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-public-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Verify official Arabic/English privacy, terms and deletion links
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://mustafaadrl93-ai.github.io/Official-Gamerz-Privacy"
          PAGES=("index.html" "privacy.html" "privacy-en.html" "terms.html" "terms-en.html" "delete-account.html")
          for page in "${PAGES[@]}"; do
            echo "Checking $BASE/$page"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 \
              "$BASE/$page" -o "$RUNNER_TEMP/$page"
            grep -qi "Gamerz" "$RUNNER_TEMP/$page"
            echo "OK: $page"
          done
          echo "All six pages accessible over HTTPS." >> "$GITHUB_STEP_SUMMARY"
